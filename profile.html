<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publisher Profile | Newsletter.mn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mode-bar">Profile publisher</div>

    <div class="page profile-page">
        <header class="site-header">
            <a class="logo" href="index.html">newsletter.mn</a>

            <nav class="site-nav" aria-label="Primary navigation"></nav>

            <div class="header-tools">
                <label class="search">
                    <input type="search" placeholder="Хайх..">
                    <span class="search-icon" aria-hidden="true"></span>
                </label>
            </div>
        </header>

        <main class="publisher-profile">
            <aside class="profile-menu" aria-label="Publisher account menu"></aside>

            <section class="profile-content">
                <header class="publisher-header"></header>
            </section>

            <button class="author-mode" type="button" aria-pressed="true">Author<br>mode: on</button>
        </main>

        <footer class="site-footer">
            <div class="footer-grid"></div>
        </footer>
    </div>

    <script type="module" src="profile.js"></script>
</body>
</html>
